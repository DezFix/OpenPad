# Сборка Windows EXE (PyInstaller) + публикация релиза.
#
# Запуск вручную: Actions → release → Run workflow (соберёт EXE как артефакт).
# Релиз: запушить тег v* (например v0.2.0) — EXE соберётся и прикрепится
# к GitHub Release автоматически.

name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-exe:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps + PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build OpenPad.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed --name OpenPad `
            --paths src `
            --collect-all sounddevice --collect-all soundfile `
            run.py
          Get-ChildItem dist\ | Select-Object Name, Length

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenPad-windows
          path: dist/OpenPad.exe

      - name: Publish GitHub Release (только для тегов)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OpenPad.exe
          generate_release_notes: true
